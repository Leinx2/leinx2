<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Courier New', monospace; fill: #39ff14; }
    .title { font-size: 46px; font-weight: bold; letter-spacing: 8px; }
    .l { font-size: 16px; }
    .dim { fill: #1f9d10; }
    @keyframes blink { 50% { opacity: 0; } }
    .cur { animation: blink 1s steps(1) infinite; }
  </style>
  <rect width="800" height="270" fill="#050a06"/>
  <rect x="14" y="14" width="772" height="242" fill="none" stroke="#39ff14"
        stroke-width="2" stroke-dasharray="7 5" filter="url(#glow)"/>
  <text x="40" y="75" class="title" filter="url(#glow)">LEINX2 // DEV</text>
  <line x1="40" y1="95" x2="760" y2="95" stroke="#1f9d10" stroke-dasharray="4 4"/>
  <text x="40" y="130" class="l dim">leinx2@github:~$ booting up...</text>
  <text x="40" y="155" class="l">[ OK ] initializing portfolio session...</text>
  <text x="40" y="190" class="l dim">leinx2@github:~$ whoami</text>
  <text x="40" y="215" class="l">backend developer | java + spring boot</text>
  <rect x="40" y="226" width="10" height="18" fill="#39ff14" class="cur"/>
</svg>
